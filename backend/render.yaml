services:
  - type: web
    name: reposhield-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: MAX_SCAN_SIZE_MB
        value: 100
      - key: MAX_SCAN_TIMEOUT_SECONDS
        value: 180
